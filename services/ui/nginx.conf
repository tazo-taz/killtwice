server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxying rather than CORS, so the browser talks to one origin and the
  # UI needs no knowledge of where the services live.
  location /api/ {
    proxy_pass http://pipeline:3000/api/;
    proxy_read_timeout 120s;
  }

  location /metrics {
    proxy_pass http://pipeline:3000/metrics;
  }

  location /consumer/ {
    proxy_pass http://consumer:3001/;
  }
}
